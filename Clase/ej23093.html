<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reloj Digital</title>
    <script>
    function relojDigital() {
            let fecha = new Date()
            let horas = fecha.getHours()
            let minutos = fecha.getMinutes()
            let segundos = fecha.getSeconds()
            if(horas<10){
                horas = "0" + horas
            }
            if(minutos<10){
                minutos = "0" + minutos
            }
            if(segundos<10){
                segundos = "0" + segundos
            }
            salida = "<font size=15>"+ horas + ":" + minutos + ":" + segundos + "</font>"
            document.getElementById("resultado").innerHTML = salida
    }
    var temporizador = setInterval(relojDigital, 1000)
    
    function iniciarParada(valor){
        document.getElementById("parar").disabled = valor
        document.getElementById("iniciar").disabled = valor
    }
    function pararReloj(){
        clearInterval(temporizador)
       iniciarParada(false)
    }
    
    function iniciarReloj(){
        temporizador = setInterval(relojDigital, 1000)
        iniciarParada(true)
    }
    </script>
</head>

<body onload="relojDigital()">
   <div id="resultado"></div>
   <button id="parar" onclick="pararReloj()">Parar Reloj</button>
   <button id="iniciar" onclick="iniciarReloj()">Iniciar Reloj</button>
   
</body>
</html>
