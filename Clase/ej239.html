<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUM</title>
    <script>
        function pumGame() {
            let salida = "";
            for (let i = 1; i <= 100; i++) {
                if(i%7 == 0 || i%10 == 7){
                    salida += "PUM <br>";
                }
                else{
                    salida += i + ", ";
                }
            }
            document.getElementById("resultado").innerHTML = salida
    }
    </script>
</head>

<body onload="pumGame()">
   <div id="resultado"></div>
</body>
</html>
