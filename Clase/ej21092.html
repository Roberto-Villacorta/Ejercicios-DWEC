<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>factorizador Validator</title>
    <script>
       function piramide(){
        let salida="";
        for(let i=0;i<10;i++){
            for(let j=1;j<=i;j++){
                salida += j;
            }
            salida += "<br>";
        }
        document.getElementById("resultado").innerHTML = salida
    }
    </script>
</head>

<body onload="piramide()">
   <div id="resultado"></div>
</body>

</html>
