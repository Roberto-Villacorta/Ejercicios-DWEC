<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>factorizador Validator</title>
    <script>
       function factorizacion(){
        let numero = parseInt(document.getElementById("num").value);
        let salida="La descompsición en factores primos de "+numero+" es: <br>";
        let i=2;
        while(i<=numero){
            if(numero%i==0){
                salida+=i+"x";
                numero/=i;
            }
            else{
                i++;
            } 
        }
        salida=salida.substring(0,salida.length-1);
        document.getElementById("resultado").innerHTML = salida
    }
    </script>
</head>

<body>
    Introduzca un número: <input type="text" id="num"><br><br>
    <button onClick="factorizacion()">Mostrar</button><br><br>
    <div id="resultado"></div>
</body>

</html>
