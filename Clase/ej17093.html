<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polideportivo</title>
    
</head>

<body onload="Mostrar()">  
    <div id="resultado"></div>
    <script>
        function Mostrar(){
        var texto = ""
        let i = 1;
        while(i<=6){
            texto += "<h"+i+">"+"Cabecera de Nivel "+i+"</h"+i+">";
            i++;
        }
        while(i>1){
            i--;
            texto += "<h"+i+">"+"Cabecera de Nivel "+i+"</h"+i+">";
        }  

        document.getElementById("resultado").innerHTML = texto;
    }
        </script>
</body>

</html>
