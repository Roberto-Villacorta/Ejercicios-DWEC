<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos</title>
    <script src="Producto.js"></script>
    <script>
        var misProductos=new Array();
        misProductos.push(new Producto("manzana",2.3,5,new Date(2026,10,18),"000001"));
        misProductos.push(new Producto("lata",3.3,10,new Date(2026,10,24),"000002"));
        var thisNum=0;
        var arrCt=misProductos.length-1;
        var accionAceptar=0;
        function fechaTexto(fecha) {
            var dia=fecha.getDate();
            var mes=fecha.getMonth()+1;
            var anio=fecha.getFullYear();
            if(dia<10) dia="0"+dia;
            if(mes<10) mes="0"+mes;
            return dia+"/"+mes+"/"+anio;
        }
        function textoFecha(texto) {
            var partes=texto.split("/");
            return new Date(Number(partes[2]),Number(partes[1])-1,Number(partes[0]));
        }
        function muestraProducto() {
            if(misProductos.length==0) {
                document.getElementById("miNombre").value="";
                document.getElementById("miPrecio").value="";
                document.getElementById("miUnidades").value="";
                document.getElementById("miFecha").value="";
                document.getElementById("miCodigo").value="";
            } else {
                document.getElementById("miNombre").value=misProductos[thisNum].nombre;
                document.getElementById("miPrecio").value=misProductos[thisNum].precio;
                document.getElementById("miUnidades").value=misProductos[thisNum].unidades;
                document.getElementById("miFecha").value=fechaTexto(misProductos[thisNum].fechaCaducidad);
                document.getElementById("miCodigo").value=misProductos[thisNum].codigo;
            }
            document.getElementById("miDivErr").innerHTML="";
        }
        function navega(direccion) {
            if(misProductos.length==0) {
                thisNum=0;
                arrCt=-1;
            } else {
                if(direccion==2) thisNum=0;
                else if(direccion==3) thisNum=arrCt;
                else {
                    thisNum=thisNum+direccion;
                    if(thisNum>arrCt) thisNum=0;
                    if(thisNum<0) thisNum=arrCt;
                }
            }
            muestraProducto();
        }
        function alta() {
            navegador(true);
            botones(true,"visible");
            document.getElementById("miNombre").value="";
            document.getElementById("miPrecio").value="";
            document.getElementById("miUnidades").value="";
            document.getElementById("miFecha").value="";
            document.getElementById("miCodigo").value="";
            document.getElementById("miNombre").focus();
            accionAceptar=1;
        }
        function baja() {
            if(misProductos.length==0) alert("No hay productos para eliminar");
            else {
                botones(true,"visible");
                accionAceptar=2;
            }
        }
        function modificacion() {
            if(misProductos.length==0) alert("No hay productos para modificar");
            else {
                botones(true,"visible");
                accionAceptar=3;
            }
        }
        function mostrarBotones() {
            navegador(false);
            botones(false,"hidden");
            accionAceptar=0;
            navega(2);
        }
        function botones(valor1,valor2) {
            document.getElementById("btnBaja").disabled=valor1;
            document.getElementById("btnMod").disabled=valor1;
            document.getElementById("btnAlta").disabled=valor1;
            document.getElementById("btnAcep").style.visibility=valor2;
            document.getElementById("btnCancel").style.visibility=valor2;
            document.getElementById("miDivErr").innerHTML="";
        }
        function navegador(valor) {
            document.getElementById("uno").disabled=valor;
            document.getElementById("dos").disabled=valor;
            document.getElementById("tres").disabled=valor;
            document.getElementById("cuatro").disabled=valor;
        }
        function validaNumero(valor) {
            if(valor.trim()=="") return false;
            if(Number.isNaN(Number(valor))) return false;
            return true;
        }
        function validaNombre(nombre) {
            var letras="abcdefghijklmnñopqrstuvwxyzáéíóúü ";
            nombre=nombre.toLowerCase();
            if(nombre.length<3 || nombre.length>25) return false;
            for(var i=0;i<nombre.length;i++) {
                if(letras.indexOf(nombre.charAt(i))==-1) return false;
            }
            return true;
        }
        function validaPrecio(precio) {
            if(!validaNumero(precio)) return false;
            if(Number(precio)<=0) return false;
            if(Math.round(Number(precio)*100)!=Number(precio)*100) return false;
            return true;
        }
        function validaUnidades(unidades) {
            if(!validaNumero(unidades)) return false;
            if(!Number.isInteger(Number(unidades))) return false;
            if(Number(unidades)<0 || Number(unidades)>999) return false;
            return true;
        }
        function validaFecha(texto) {
            if(texto=="") return false;
            var partes=texto.split("/");
            if(partes.length!=3) return false;
            if(partes[0].length!=2 || partes[1].length!=2 || partes[2].length!=4) return false;
            if(!validaNumero(partes[0]) || !validaNumero(partes[1]) || !validaNumero(partes[2])) return false;
            var dia=Number(partes[0]);
            var mes=Number(partes[1]);
            var anio=Number(partes[2]);
            var fecha=new Date(anio,mes-1,dia);
            if(fecha.getDate()!=dia || fecha.getMonth()!=mes-1 || fecha.getFullYear()!=anio) return false;
            var hoy=new Date();
            hoy.setHours(0,0,0,0);
            if(fecha<=hoy) return false;
            return true;
        }
        function validaCodigo(codigo) {
            if(codigo.length!=6) return false;
            for(var i=0;i<codigo.length;i++) {
                if(codigo.charAt(i)<"0" || codigo.charAt(i)>"9") return false;
            }
            return true;
        }
        function validaDatos() {
            var nombre=document.getElementById("miNombre").value.trim();
            var precio=document.getElementById("miPrecio").value.trim();
            var unidades=document.getElementById("miUnidades").value.trim();
            var fecha=document.getElementById("miFecha").value.trim();
            var codigo=document.getElementById("miCodigo").value.trim();
            var correcto=true;
            var errores="";
            if(nombre=="") {
                errores+="Debe introducir el nombre del producto.<br>";
                correcto=false;
            } else if(!validaNombre(nombre)) {
                errores+="El nombre debe tener entre 3 y 25 letras.<br>";
                correcto=false;
            }
            if(precio=="") {
                errores+="Debe introducir el precio.<br>";
                correcto=false;
            } else if(!validaPrecio(precio)) {
                errores+="El precio debe ser positivo y tener como máximo dos decimales.<br>";
                correcto=false;
            }
            if(unidades=="") {
                errores+="Debe introducir las unidades.<br>";
                correcto=false;
            } else if(!validaUnidades(unidades)) {
                errores+="Las unidades deben ser un entero entre 0 y 999.<br>";
                correcto=false;
            }
            if(fecha=="") {
                errores+="Debe introducir la fecha de caducidad.<br>";
                correcto=false;
            } else if(!validaFecha(fecha)) {
                errores+="La fecha debe ser válida y posterior a hoy (dd/mm/aaaa).<br>";
                correcto=false;
            }
            if(codigo=="") {
                errores+="Debe introducir el código.<br>";
                correcto=false;
            } else if(!validaCodigo(codigo)) {
                errores+="El código debe tener exactamente 6 números.<br>";
                correcto=false;
            }
            document.getElementById("miDivErr").innerHTML=errores;
            return correcto;
        }
        function gestionarAlta() {
            if(validaDatos()) {
                var confirma=confirm("¿Quiere guardar el producto?");
                if(confirma) {
                    try {
                        var nuevoProducto=new Producto(
                            document.getElementById("miNombre").value.trim(),
                            Number(document.getElementById("miPrecio").value),
                            Number(document.getElementById("miUnidades").value),
                            textoFecha(document.getElementById("miFecha").value),
                            document.getElementById("miCodigo").value.trim()
                        );
                        misProductos.push(nuevoProducto);
                        arrCt=misProductos.length-1;
                        alert("Producto añadido correctamente");
                        mostrarBotones();
                    } catch(error) {
                        document.getElementById("miDivErr").innerHTML="Error: "+error.message;
                    }
                }
            }
        }
        function gestionarBaja() {
            if(misProductos.length==0) alert("El array está vacío");
            else {
                var confirma=confirm("¿Realmente quiere eliminar este producto?");
                if(confirma) {
                    misProductos.splice(thisNum,1);
                    arrCt=misProductos.length-1;
                    if(thisNum>arrCt) thisNum=arrCt;
                    alert("Producto eliminado correctamente");
                    if(misProductos.length==0) thisNum=0;
                    mostrarBotones();
                } else mostrarBotones();
            }
        }
        function gestionarModificacion() {
            if(validaDatos()) {
                var confirma=confirm("¿Quiere guardar los cambios?");
                if(confirma) {
                    try {
                        var productoTemporal=new Producto(
                            document.getElementById("miNombre").value.trim(),
                            Number(document.getElementById("miPrecio").value),
                            Number(document.getElementById("miUnidades").value),
                            textoFecha(document.getElementById("miFecha").value),
                            document.getElementById("miCodigo").value.trim()
                        );
                        misProductos[thisNum].nombre=productoTemporal.nombre;
                        misProductos[thisNum].precio=productoTemporal.precio;
                        misProductos[thisNum].unidades=productoTemporal.unidades;
                        misProductos[thisNum].fechaCaducidad=productoTemporal.fechaCaducidad;
                        misProductos[thisNum].codigo=productoTemporal.codigo;
                        alert("Producto modificado correctamente");
                        mostrarBotones();
                    } catch(error) {
                        document.getElementById("miDivErr").innerHTML="Error: "+error.message;
                    }
                }
            }
        }
        function aceptar() {
            document.getElementById("miDivErr").innerHTML="";
            if(accionAceptar==1) gestionarAlta();
            if(accionAceptar==2) gestionarBaja();
            if(accionAceptar==3) gestionarModificacion();
        }
        function listadoVentana() {
            if(misProductos.length==0) {
                alert("No hay productos para mostrar");
            } else {
                var salida="<table border='2' cellpadding='5'>";
                salida+="<tr><th>Nombre</th><th>Precio</th><th>Unidades</th><th>Caducidad</th><th>Código</th></tr>";
                for(var i=0;i<misProductos.length;i++) {
                    salida+="<tr>";
                    salida+="<td>"+misProductos[i].nombre+"</td>";
                    salida+="<td>"+misProductos[i].precio+"</td>";
                    salida+="<td>"+misProductos[i].unidades+"</td>";
                    salida+="<td>"+fechaTexto(misProductos[i].fechaCaducidad)+"</td>";
                    salida+="<td>"+misProductos[i].codigo+"</td>";
                    salida+="</tr>";
                }
                salida+="</table>";
                var miWindow=window.open("","ventana","width=650,height=400,top=200,left=200");
                if(miWindow!=null) {
                    miWindow.document.open();
                    miWindow.document.write("<html><head><title>Listado de productos</title></head><body><center>");
                    miWindow.document.write("<h3>Listado de productos</h3>");
                    miWindow.document.write(salida);
                    miWindow.document.write("<br><br><input type='button' value='Cerrar ventana' onclick='window.close();'>");
                    miWindow.document.write("</center></body></html>");
                    miWindow.document.close();
                }
            }
        }
        function listadoVentana3() {
            if(misProductos.length==0) {
                alert("No hay productos para mostrar");
            } else {
                var p=misProductos[thisNum];
                alert("DATOS DEL PRODUCTO\n\nNombre: "+p.nombre+"\nPrecio: "+p.precio+"\nUnidades: "+p.unidades+"\nCaducidad: "+fechaTexto(p.fechaCaducidad)+"\nCódigo: "+p.codigo);
            }
        }
        function validaCantidad(cantidad) {
            if(!validaNumero(cantidad)) return false;
            if(!Number.isInteger(Number(cantidad))) return false;
            if(Number(cantidad)<=0) return false;
            return true;
        }
        function vender() {
            if(misProductos.length==0) {
                alert("No hay productos");
            } else {
                var cantidad=prompt("¿Cuántas unidades desea vender?");
                if(cantidad!=null && cantidad.trim()!="") {
                    if(!validaCantidad(cantidad)) {
                        alert("Debe introducir un número entero positivo");
                    } else {
                        try {
                            misProductos[thisNum].vender(Number(cantidad));
                            alert("Venta realizada correctamente");
                            muestraProducto();
                        } catch(error) {
                            alert(error.message);
                        }
                    }
                }
            }
        }
        function reponer() {
            if(misProductos.length==0) {
                alert("No hay productos");
            } else {
                var cantidad=prompt("¿Cuántas unidades desea reponer?");
                if(cantidad!=null && cantidad.trim()!="") {
                    if(!validaCantidad(cantidad)) {
                        alert("Debe introducir un número entero positivo");
                    } else {
                        try {
                            misProductos[thisNum].reponer(Number(cantidad));
                            alert("Reposición realizada correctamente");
                            muestraProducto();
                        } catch(error) {
                            alert(error.message);
                        }
                    }
                }
            }
        }
        function descuento() {
            if(misProductos.length==0) {
                alert("No hay productos");
            } else {
                var porcentaje=prompt("Introduzca el porcentaje de descuento:");
                if(porcentaje!=null && porcentaje.trim()!="") {
                    if(!validaNumero(porcentaje) || Number(porcentaje)<0 || Number(porcentaje)>100) {
                        alert("El descuento debe estar entre 0 y 100");
                    } else {
                        var resultado=misProductos[thisNum].precioConDescuento(Number(porcentaje));
                        alert("Precio con descuento: "+resultado+" €");
                    }
                }
            }
        }
        function comprobarCaducidad() {
            if(misProductos.length==0) {
                alert("No hay productos");
            } else {
                var p=misProductos[thisNum];
                var mensaje="";
                if(p.estaCaducado()) {
                    mensaje="El producto está caducado.";
                } else {
                    mensaje="El producto todavía no está caducado.\n";
                    mensaje+="Días para caducar: "+p.diasParaCaducar();
                }
                alert(mensaje);
            }
        }
        window.onload=function() {
            navega(2);
            botones(false,"hidden");
        }
    </script>
</head>
<body>

        <input type="text" id="miNombre">

        <input type="text" id="miPrecio">

        <input type="text" id="miCodigo">
        <br><br>
        <div id="divBtn">
            <input type="button" onclick="navega(2)" value="Primera" id="uno">

        <div id="divBtn3">

        <div id="divBtn2">
            <input type="button" onclick="alta()" value="Alta" id="btnAlta">

            <input type="button" onclick="modificacion()" value="Modificación" id="btnMod">
            <input type="button" onclick="listadoVentana()" value="Listado">
            <input type="button" onclick="listadoVentana3()" value="Muestra un producto">

</html>
