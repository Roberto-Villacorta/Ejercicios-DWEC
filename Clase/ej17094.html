<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabeceras Dinámicas</title>
    <script>
       function generarCabeceras(){
        let texto = document.getElementById("texto").value;
        let n = parseInt(document.getElementById("num").value);
        let resultado = document.getElementById("resultado");
        let salida = "";

        if (isNaN(n) || n < 1 || n > 6) {
            salida = "<p style='color:red;'>Debes introducir un número entre 1 y 6.</p>";
            document.getElementById("num").value = "";
            document.getElementById("num").focus();
        }
        else{
        let i = 1;
       
        while(i<=n){
            salida += "<h"+i+">"+texto+"</h"+i+">";
            i++;
        }
        i--;
        while(i>=1){
            salida += "<h"+i+">"+texto+"</h"+i+">";
            i--;
        } 
       }
        document.getElementById("resultado").innerHTML = salida;
    }
    </script>
</head>

<body>
    Introduce un texto: <input type="text" id="texto"><br><br>
    Introduce n (entre 1 y 6): <input type="text" id="num"><br><br>
    <button onClick="generarCabeceras()">Generar</button><br><br>
    <div id="resultado"></div>
</body>

</html>
