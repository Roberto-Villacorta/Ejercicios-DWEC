<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabeceras Dinámicas</title>
    <script>
       function generarCabeceras(){
        let texto = document.getElementById("texto").value;
        let n = parseInt(document.getElementById("num").value);
        let resultado = document.getElementById("resultado");

        if (isNaN(n) || n < 1 || n > 6) {
            resultado.innerHTML = "<p style='color:red;'>Debes introducir un número entre 1 y 6.</p>";
            return;
        }

        let salida = "";
        for (let i = 1; i <= n; i++) {
            salida += "<h" + i + ">" + texto + "</h" + i + ">";
        }
        for (let i = n - 1; i >= 1; i--) {
            salida += "<h" + i + ">" + texto + "</h" + i + ">";
        }

        resultado.innerHTML = salida;
       }
    </script>
</head>

<body>
    Introduce un texto: <input type="text" id="texto"><br><br>
    Introduce n (entre 1 y 6): <input type="number" id="num" min="1" max="6"><br><br>
    <button onClick="generarCabeceras()">Generar</button><br><br>
    <div id="resultado"></div>
</body>

</html>
